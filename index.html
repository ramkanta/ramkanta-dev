<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <title>Ramkanta Pramanik — Full Stack Developer (TypeScript, NestJS, Next.js)</title>
    <meta
      name="description"
      content="Ramkanta Pramanik is a full stack developer in Kalyani, West Bengal, building production healthcare and e-commerce systems in TypeScript, NestJS and Next.js — 70+ REST endpoints, Razorpay payments and AWS infrastructure."
    />
    <link rel="canonical" href="https://ramkanta.in/" />
    <meta name="author" content="Ramkanta Pramanik" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1" />
    <meta name="theme-color" content="#faf8f5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#100f0d" media="(prefers-color-scheme: dark)" />

    <!-- Open Graph. Absolute URLs and a real PNG: crawlers do not resolve
         relative paths, and no major platform renders an SVG card. -->
    <meta property="og:type" content="profile" />
    <meta property="og:site_name" content="Ramkanta Pramanik" />
    <meta property="og:url" content="https://ramkanta.in/" />
    <meta property="og:title" content="Ramkanta Pramanik — Full Stack Developer" />
    <meta
      property="og:description"
      content="Full stack developer building production healthcare and e-commerce systems in TypeScript, NestJS and Next.js."
    />
    <meta property="og:image" content="https://ramkanta.in/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Ramkanta Pramanik — Full Stack Developer" />
    <meta property="og:locale" content="en_IN" />
    <meta property="profile:first_name" content="Ramkanta" />
    <meta property="profile:last_name" content="Pramanik" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Ramkanta Pramanik — Full Stack Developer" />
    <meta
      name="twitter:description"
      content="Full stack developer building production healthcare and e-commerce systems in TypeScript, NestJS and Next.js."
    />
    <meta name="twitter:image" content="https://ramkanta.in/og.png" />

    <!-- rel="me" ties this domain to the profiles that link back to it -->
    <link rel="me" href="https://www.linkedin.com/in/ramkanta-pramanik-96123a1ba/" />
    <link rel="me" href="https://github.com/ramkanta" />
    <link rel="me" href="https://www.facebook.com/ramkanta.p.2025" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <script>
      // Marks that scripting is available, so the scroll-reveal styles may
      // hide content. Without this class the prerendered page stays visible.
      document.documentElement.classList.add('js')

      // Apply the stored theme before first paint, so there is no flash.
      try {
        var stored = localStorage.getItem('theme')
        var dark = stored
          ? stored === 'dark'
          : window.matchMedia('(prefers-color-scheme: dark)').matches
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
      } catch (e) {}
    </script>

    <!--seo-jsonld-->
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
